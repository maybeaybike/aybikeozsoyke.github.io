<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aybike Özsöyke</title>
<meta name="description" content="Ses Tasarımcısı, Müzik Prodüktörü ve Creative Technologist — İzmir, Türkiye">
<meta property="og:title" content="Aybike Özsöyke">
<meta property="og:description" content="Ses Tasarımcısı · Müzik Prodüktörü · Creative Technologist">
<meta property="og:image" content="https://aybikeozsoyke.com/logo.png">
<meta property="og:url" content="https://aybikeozsoyke.com">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Aybike Özsöyke">
<meta name="twitter:description" content="Ses Tasarımcısı · Müzik Prodüktörü · Creative Technologist">
<meta name="twitter:image" content="https://aybikeozsoyke.com/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,600&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#04040c;--surface:#08081a;--border:#0e1430;--border2:#162040;
  --text:#d8dde6;--text-muted:#9ac4da;--text-dim:#6a9ab8;
  --accent:#00aaff;--accent-dim:#00335a;
  --font-d:'Cormorant Garamond',Georgia,serif;
  --font-m:'IBM Plex Mono',monospace;
  --nav-h:64px;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--font-m);font-weight:300;font-size:13px;line-height:1.7;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:999;opacity:.6}

/* ─── MASAÜSTÜ NAV ─── */
nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);border-bottom:1px solid var(--border);display:flex;flex-direction:row;align-items:center;padding:0 48px;z-index:100;background:var(--bg);gap:24px}
.nav-logo{cursor:pointer;flex-shrink:0}
.nav-logo-img{max-width:130px;height:auto;display:block;opacity:.85;transition:opacity .2s}
.nav-logo-img:hover{opacity:1}
.nav-links{margin-left:auto;display:flex;flex-direction:row;gap:0;list-style:none}
.nav-links a{font-family:var(--font-m);font-size:10px;font-weight:400;color:var(--text);text-decoration:none;letter-spacing:.1em;padding:8px 14px;transition:color .2s;cursor:pointer;display:block}
.nav-links a:hover,.nav-links a.active{color:var(--text)}
.nav-links a.active{color:var(--accent)}
.lang-trigger{display:flex;align-items:center;gap:6px;background:none;border:1px solid var(--border);padding:5px 10px;cursor:pointer;font-family:var(--font-m);font-size:10px;color:var(--text-muted);letter-spacing:.08em;flex-shrink:0;transition:all .2s}
.lang-trigger:hover{border-color:var(--accent-dim);color:var(--text)}
.lang-trigger-arrow{font-size:8px;color:var(--text-dim)}
.lang-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500}
.lang-modal-overlay.open{display:block}
.lang-modal{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:501;background:var(--surface);border:1px solid var(--border);padding:40px 32px 32px;width:min(720px,94vw);max-height:80vh;overflow-y:auto}
.lang-modal.open{display:block}
.lang-modal-close{position:absolute;top:14px;right:16px;background:none;border:none;font-size:14px;color:var(--text-dim);cursor:pointer;transition:color .2s}
.lang-modal-close:hover{color:var(--accent)}
.lang-modal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border)}
.lang-modal-item{display:flex;align-items:center;gap:10px;padding:13px 16px;background:var(--bg);cursor:pointer;transition:background .2s;font-family:var(--font-m);font-size:11px;color:var(--text-muted);letter-spacing:.05em}
.lang-modal-item:hover{background:var(--surface);color:var(--text)}
.lang-modal-item.active{color:var(--accent)}
.lang-modal-flag{font-size:20px;line-height:1;flex-shrink:0}
.nav-bottom{display:none}
.nav-hamburger{display:none}
.nav-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:150}
.nav-overlay.open{display:block}

/* ─── MAIN ─── */
main{padding-top:var(--nav-h);min-height:100vh}
.page{display:none;padding:64px 80px;min-height:calc(100vh - var(--nav-h));animation:fadein .4s ease}
.page.active{display:block}
#home{display:none}
#home.active{display:flex;flex-direction:row;align-items:center;gap:72px;padding:80px;min-height:calc(100vh - var(--nav-h))}
.home-left{flex:1;min-width:0}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.home-eyebrow{font-family:var(--font-m);font-size:10px;color:var(--accent);letter-spacing:.2em;margin-bottom:24px}
.home-name{font-family:var(--font-d);font-size:clamp(56px,8vw,110px);font-weight:300;color:var(--text);line-height:.9;letter-spacing:-.02em;margin-bottom:40px}
.home-name em{font-style:italic;color:var(--accent)}
.home-tagline{font-family:var(--font-m);font-size:11px;color:var(--text-muted);letter-spacing:.1em;display:flex;gap:24px;flex-wrap:wrap}
.home-tagline span::before{content:'— ';color:var(--accent)}
#homeCanvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:0;transition:opacity 1.4s}
.home-terminal{width:460px;flex-shrink:0;background:rgba(4,4,12,.97);border:1px solid var(--border2);cursor:pointer;transition:border-color .25s;position:relative;z-index:1;margin-top:0}
.home-terminal:hover{border-color:var(--accent-dim)}
.home-terminal-header{background:var(--surface);padding:9px 14px;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--border)}
.home-terminal-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.home-terminal-dot:nth-child(1){background:#ff5f57}
.home-terminal-dot:nth-child(2){background:#febc2e}
.home-terminal-dot:nth-child(3){background:#28c840}
.home-terminal-label{font-family:var(--font-m);font-size:9px;letter-spacing:.15em;color:var(--text-dim);margin-left:auto}
.home-terminal-body{padding:18px 22px 14px;line-height:1.85;min-height:88px;font-size:12px}
.t-kw{color:var(--accent)}.t-fn{color:#9d85c4}.t-str{color:#7eb89c}.t-num{color:#d4a96a}.t-cm{color:var(--text-dim)}
.home-terminal-cursor{display:inline-block;width:7px;height:13px;background:var(--accent);vertical-align:text-bottom;margin-left:1px;animation:tcblink .7s step-end infinite}
@keyframes tcblink{0%,100%{opacity:1}50%{opacity:0}}
.home-terminal-hint{font-size:9px;letter-spacing:.1em;color:var(--text-dim);padding:5px 22px 10px;opacity:.45}
.term-viz{width:100%;height:54px;display:block;border-top:1px solid var(--border)}
.t-kw{color:#00aaff}.t-fn{color:#66d9ff}.t-str{color:#44eeaa}.t-num{color:#ffcc44}.t-cm{color:var(--text-dim)}

.section-label{font-family:var(--font-m);font-size:10px;color:var(--accent);letter-spacing:.2em;margin-bottom:48px;display:flex;align-items:center;gap:16px}
.section-label::after{content:'';flex:1;max-width:60px;height:1px;background:var(--border2)}

/* ─── HAKKIMDA: masaüstünde iki sütun ─── */
.about-layout{display:grid;grid-template-columns:1fr 360px;gap:72px;align-items:start;max-width:1100px}
.about-text{font-family:var(--font-d);font-size:21px;font-weight:300;color:var(--text);line-height:1.8;text-align:justify}
.about-text strong{font-weight:500;color:var(--accent)}
.about-text em{font-style:italic;color:var(--text-muted)}
.about-right{display:flex;flex-direction:column;gap:0}
.about-photo{width:100%;aspect-ratio:1/1;object-fit:cover;object-position:center top;display:block;order:0}
.about-meta{order:1}
.about-meta{display:flex;flex-direction:column;gap:1px;background:var(--border);border:1px solid var(--border)}
.meta-item{background:var(--bg);padding:24px 28px}
.meta-label{font-family:var(--font-m);font-size:9px;color:var(--text-dim);letter-spacing:.18em;margin-bottom:10px;text-transform:uppercase}
.meta-value{font-family:var(--font-d);font-size:17px;font-weight:400;color:var(--text);line-height:1.7}


/* ─── İŞLER ─── */
.works-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--border);border:1px solid var(--border);max-width:900px}
.work-item{background:var(--bg);padding:32px 36px;transition:background .2s}
.work-item:hover{background:var(--surface)}
.work-type{font-family:var(--font-m);font-size:9px;color:var(--accent);letter-spacing:.18em;margin-bottom:12px;text-transform:uppercase}
.work-title{font-family:var(--font-d);font-size:24px;font-weight:400;font-style:italic;color:var(--text);margin-bottom:8px;line-height:1.2}
.work-role{font-family:var(--font-m);font-size:11px;color:var(--text-muted);margin-bottom:16px}
.work-desc{font-family:var(--font-m);font-size:11px;color:var(--text-dim);line-height:1.6}
.work-badge{display:inline-block;margin-top:16px;font-family:var(--font-m);font-size:9px;letter-spacing:.15em;color:var(--accent);border:1px solid var(--accent-dim);padding:4px 10px;text-transform:uppercase}

/* ─── MÜZİK ─── */
.music-filters{max-width:860px;margin-bottom:0}
/* Desktop dropdown — hover + click ile açılır, nav gibi */
.music-dd-wrap{position:relative;display:inline-block}
/* Hover alanını menüye kadar uzatan köprü (gap fix) */
.music-dd-wrap::after{content:'';position:absolute;top:100%;left:0;right:0;height:8px;z-index:49}
.music-dd-trigger{font-family:var(--font-m);font-size:10px;letter-spacing:.12em;color:var(--text-muted);background:var(--bg);border:1px solid var(--border2);padding:11px 20px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:all .2s;min-width:200px;justify-content:space-between;width:100%}
.music-dd-wrap:hover .music-dd-trigger,.music-dd-wrap.open .music-dd-trigger{border-color:var(--accent-dim);color:var(--text)}
.music-dd-arrow{font-size:9px;color:var(--text-dim);transition:transform .2s}
.music-dd-wrap:hover .music-dd-arrow,.music-dd-wrap.open .music-dd-arrow{transform:rotate(180deg)}
.music-dd-menu{display:none;position:absolute;top:100%;left:0;right:0;background:var(--surface);border:1px solid var(--border2);border-top:none;z-index:50;min-width:200px}
.music-dd-wrap:hover .music-dd-menu,.music-dd-wrap.open .music-dd-menu{display:block}
.music-dd-item{font-family:var(--font-m);font-size:10px;letter-spacing:.1em;color:var(--text-muted);background:none;border:none;width:100%;padding:12px 20px;text-align:left;cursor:pointer;transition:all .2s}
.music-dd-item:hover{color:var(--text);background:var(--border)}
.music-dd-item.active{color:var(--accent)}
/* Mobile toggle — nav gibi accordion */
.music-toggle-wrap{display:none;border:1px solid var(--border)}
.music-toggle-header{display:flex;align-items:center;width:100%;background:var(--bg)}
.music-toggle-label{font-family:var(--font-m);font-size:10px;letter-spacing:.12em;color:var(--text-muted);padding:13px 20px;flex:1}
.music-toggle-plus{display:flex;align-items:center;justify-content:center;width:44px;height:44px;flex-shrink:0;background:none;border:none;border-left:1px solid var(--border);color:var(--text-dim);font-size:14px;cursor:pointer;transition:all .2s;font-family:var(--font-m);line-height:1}
.music-toggle-plus:hover{color:var(--accent)}
.music-toggle-opts{display:none;flex-direction:column;border-top:1px solid var(--border)}
.music-toggle-opts.open{display:flex}
.music-mode-btn{font-family:var(--font-m);font-size:10px;letter-spacing:.1em;color:var(--text-dim);background:var(--bg);border:none;border-bottom:1px solid var(--border);padding:13px 20px;cursor:pointer;text-align:left;width:100%;transition:all .2s}
.music-mode-btn:last-child{border-bottom:none}
.music-mode-btn:hover{color:var(--text);background:var(--surface)}
.music-mode-btn.active{color:var(--accent);background:var(--surface)}
.music-list{display:flex;flex-direction:column;gap:1px;background:var(--border);border:1px solid var(--border);max-width:860px}
.music-item{background:var(--bg);padding:20px 32px;display:grid;grid-template-columns:36px 1fr auto;gap:18px;align-items:center;transition:background .2s;cursor:pointer}
.music-item:hover{background:var(--surface)}
.music-item.no-video{cursor:default}
.music-play{width:34px;height:34px;border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:9px;flex-shrink:0;transition:all .2s}
.music-item:not(.no-video):hover .music-play{border-color:var(--accent);color:var(--accent)}
.music-info{min-width:0}
.music-title{font-family:var(--font-d);font-size:19px;font-weight:400;font-style:italic;color:var(--text);margin-bottom:2px}
.music-by{font-family:var(--font-m);font-size:10px;color:var(--text-muted);margin-bottom:6px}
.music-bottom{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.music-cat-tag{font-family:var(--font-m);font-size:8px;color:var(--text-dim);letter-spacing:.1em}
.music-cat-header{font-family:var(--font-m);font-size:9px;letter-spacing:.18em;color:var(--text-dim);padding:14px 20px 10px;text-transform:uppercase;background:var(--surface);border-bottom:1px solid var(--border);width:100%}
.music-links{display:flex;gap:6px;flex-wrap:wrap}
.music-link-btn{font-family:var(--font-m);font-size:8px;letter-spacing:.08em;color:var(--accent);border:1px solid var(--accent-dim);padding:3px 8px;text-decoration:none;transition:all .2s;white-space:nowrap}
.music-link-btn:hover{background:var(--accent);color:var(--bg)}
.music-year{font-family:var(--font-m);font-size:10px;color:var(--text-dim);text-align:right;white-space:nowrap;flex-shrink:0;align-self:start;padding-top:4px}
.music-player{max-width:860px;background:var(--surface);border:1px solid var(--border);border-top:none;display:none}
.music-player.open{display:block}
.music-player-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;border-bottom:1px solid var(--border)}
.music-player-label{font-family:var(--font-m);font-size:9px;color:var(--text-muted);letter-spacing:.08em}
.music-player-close{font-family:var(--font-m);font-size:9px;color:var(--text-dim);background:none;border:none;cursor:pointer;transition:color .2s;letter-spacing:.1em}
.music-player-close:hover{color:var(--accent)}
.music-player-frame{position:relative;width:100%;aspect-ratio:16/9}
.music-player-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:none}

/* ─── SERGİLER ─── */
.exh-list{display:flex;flex-direction:column;gap:40px;max-width:780px}
.exh-item{display:grid;grid-template-columns:90px 1fr;gap:32px;padding-bottom:40px;border-bottom:1px solid var(--border)}
.exh-item:last-child{border-bottom:none;padding-bottom:0}
.exh-year{font-family:var(--font-m);font-size:11px;color:var(--accent);padding-top:6px}
.exh-title{font-family:var(--font-d);font-size:22px;font-weight:400;font-style:italic;color:var(--text);margin-bottom:6px;line-height:1.3}
.exh-venue{font-family:var(--font-m);font-size:10px;color:var(--text-dim);margin-bottom:10px}
.exh-roles{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.exh-role{font-family:var(--font-m);font-size:9px;letter-spacing:.12em;color:var(--accent);border:1px solid var(--accent-dim);padding:3px 9px;text-transform:uppercase}
.exh-desc{font-family:var(--font-m);font-size:11px;color:var(--text-dim);line-height:1.7}
.blog-soon{font-family:var(--font-d);font-size:22px;color:var(--text-muted);font-style:italic;padding:60px 0}

/* ─── İLETİŞİM: profesyonel tasarım ─── */
.contact-intro{font-family:var(--font-d);font-size:30px;font-weight:300;color:var(--text);line-height:1.4;margin-bottom:56px;max-width:620px}
.contact-intro em{font-style:italic;color:var(--accent)}
.contact-email-block{display:flex;align-items:center;gap:20px;max-width:900px;border:1px solid var(--border);padding:26px 40px;margin-bottom:1px;text-decoration:none;background:var(--bg);transition:background .2s;cursor:pointer}
.contact-email-block:hover{background:var(--surface)}
.contact-email-block:hover .contact-email-arrow{color:var(--accent)}
.contact-email-addr{font-family:var(--font-d);font-size:22px;font-weight:400;color:var(--text);letter-spacing:.01em;flex:1}
.contact-email-arrow{font-family:var(--font-m);font-size:16px;color:var(--text-dim);transition:color .2s;flex-shrink:0}
.contact-email-icon{width:22px;height:22px;fill:var(--text-dim);flex-shrink:0;transition:fill .2s}
.contact-email-block:hover .contact-email-icon{fill:var(--accent)}
.contact-lower{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border:1px solid var(--border);max-width:900px}
.contact-group{background:var(--bg);padding:32px 40px}
.contact-group-label{font-family:var(--font-m);font-size:9px;color:var(--text-dim);letter-spacing:.18em;margin-bottom:24px;padding-bottom:14px;border-bottom:1px solid var(--border);text-transform:uppercase}
.contact-link{display:flex;align-items:center;justify-content:space-between;font-family:var(--font-d);font-size:20px;font-weight:400;color:var(--text-muted);text-decoration:none;padding:10px 0;transition:color .2s;border-bottom:1px solid var(--border)}
.contact-link-left{display:flex;align-items:center;gap:9px}
.contact-link-icon{width:16px;height:16px;flex-shrink:0;fill:currentColor;opacity:.65;transition:opacity .2s}
.contact-link:hover .contact-link-icon{opacity:1}
.contact-link:last-child{border-bottom:none}
.contact-link:hover{color:var(--accent)}
.contact-link-sub{font-family:var(--font-m);font-size:9px;color:var(--text-dim);letter-spacing:.08em;transition:color .2s}
.contact-link:hover .contact-link-sub{color:var(--accent-dim)}

.nav-toggle{display:none}
.nav-item-header{display:contents}

/* ─── NAV DROPDOWN ─── */
.nav-item-wrap{position:relative}
.nav-dropdown{position:absolute;top:100%;left:0;min-width:180px;background:var(--bg);border:1px solid var(--border);display:none;z-index:200;flex-direction:column}
.nav-item-wrap:hover .nav-dropdown{display:flex}
.nav-dropdown a{font-family:var(--font-m);font-size:10px;color:var(--text);letter-spacing:.08em;padding:12px 18px;cursor:pointer;text-decoration:none;display:block;transition:color .2s;border-bottom:1px solid var(--border);white-space:nowrap}
.nav-dropdown a:last-child{border-bottom:none}
.nav-dropdown a:hover{color:var(--accent)}

/* ─── BASIN / PRESS ─── */
.press-list{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--border);border:1px solid var(--border);max-width:900px}
.press-item{background:var(--bg);padding:28px 36px;transition:background .2s}
.press-item:hover{background:var(--surface)}
.press-year{font-family:var(--font-m);font-size:9px;color:var(--accent);letter-spacing:.15em;margin-bottom:10px}
.press-source{font-family:var(--font-m);font-size:9px;color:var(--text-dim);letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}
.press-title{font-family:var(--font-d);font-size:22px;font-weight:400;font-style:italic;color:var(--text);margin-bottom:8px;line-height:1.3}
.press-desc{font-family:var(--font-m);font-size:11px;color:var(--text-dim);line-height:1.7}
.press-links{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.press-link{font-family:var(--font-m);font-size:8px;letter-spacing:.1em;color:var(--accent);border:1px solid var(--accent-dim);padding:3px 10px;text-decoration:none;transition:all .2s;white-space:nowrap}
.press-link:hover{background:var(--accent);color:var(--bg)}

/* ─── SERTİFİKALAR ─── */
.cert-list{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--border);border:1px solid var(--border);max-width:900px}
.cert-item{background:var(--bg);padding:28px 32px;transition:background .2s}
.cert-item:hover{background:var(--surface)}
.cert-date{font-family:var(--font-m);font-size:9px;color:var(--accent);letter-spacing:.15em;margin-bottom:8px}
.cert-title{font-family:var(--font-d);font-size:20px;font-weight:400;font-style:italic;color:var(--text);margin-bottom:6px;line-height:1.3}
.cert-org{font-family:var(--font-m);font-size:10px;color:var(--text-muted);margin-bottom:8px}
.cert-skills{font-family:var(--font-m);font-size:9px;color:var(--text-dim);letter-spacing:.08em}

// ── Livecoding snippet'leri ────────────────────────────────────────────
const LIVECODE_SNIPPETS = [
  { lang:'tidal', code:`d1 $ s "bd sd hh cp"\n  # gain 0.8\n  # room 0.3\n\nd2 $ note (scale "minor"\n    "0 2 4 7")\n  # s "superpiano"` },
  { lang:'tidal', code:`setcps (130/60/4)\n\nd1 $ every 4 (fast 2)\n  $ s "bd ~ sd ~"\n  |+ speed rand\n  # delay 0.4` },
  { lang:'tidal', code:`d1 $ sound "arpy*8"\n  # note (scale "dorian"\n    (irand 7))\n  # pan rand\n  # room 0.6` },
  { lang:'sc', code:`{ SinOsc.ar(\n    LFNoise1.kr(0.5)\n      .range(200, 800),\n    0, 0.3\n  )\n}.play` },
  { lang:'tidal', code:`d1 $ slow 2\n  $ struct "t f t t f t f t"\n  $ s "hh27"\n  # pan (sine)\n\nd2 $ s "bass3" # n 0` },
];

let _termIdx = 0, _termChar = 0, _termTimer = null, _termStarted = false;

function formatLiveCode(text, lang) {
  let h = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  if (lang === 'tidal') {
    h = h.replace(/\b(d1|d2|d3|d4|setcps|every|fast|slow|note|s|gain|room|pan|speed|delay|irand|rand|scale|sound|struct|sine)\b/g,'<span class="t-kw">$1</span>');
    h = h.replace(/"([^"]*)"/g,'<span class="t-str">"$1"</span>');
    h = h.replace(/\b(\d+\.?\d*)\b/g,'<span class="t-num">$1</span>');
  } else if (lang === 'sc') {
    h = h.replace(/\b(SinOsc|LFNoise1|ar|kr|play|range)\b/g,'<span class="t-fn">$1</span>');
    h = h.replace(/\b(\d+\.?\d*)\b/g,'<span class="t-num">$1</span>');
  }
  return h.replace(/\n/g,'<br>');
}

function typeTerminal() {
  const el = document.getElementById('termCode');
  if (!el) return;
  clearTimeout(_termTimer);
  const sn = LIVECODE_SNIPPETS[_termIdx];
  playTermTone(_termIdx); // sesi hemen başlat, yazma bitimini bekleme
  function tick() {
    if (_termChar <= sn.code.length) {
      el.innerHTML = formatLiveCode(sn.code.slice(0, _termChar), sn.lang);
      _termChar++;
      _termTimer = setTimeout(tick, 24 + Math.random() * 32);
    } else {
      _termTimer = setTimeout(() => {
        _termIdx = (_termIdx + 1) % LIVECODE_SNIPPETS.length;
        _termChar = 0;
        typeTerminal();
      }, 3800);
    }
  }
  tick();
}

function advanceTerminal() {
  initTermAudio();
  _termIdx = (_termIdx + 1) % LIVECODE_SNIPPETS.length;
  _termChar = 0;
  typeTerminal();
}

// ── Term-viz: Hydra/TouchDesigner tarzı plasma görselleştirme ────────────
function initTermViz() {
  const c = document.getElementById('termViz');
  if (!c) return;
  const ctx = c.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  let W = 0, H = 0;
  function resize() {
    W = c.offsetWidth; H = c.offsetHeight;
    c.width = W * dpr; c.height = H * dpr;
    ctx.scale(dpr, dpr);
  }
  resize();
  new ResizeObserver(resize).observe(c);
  let _t = 0;
  (function drawViz() {
    requestAnimationFrame(drawViz);
    if (!W || !H) return;
    // Hydra-tarzı persistence: önceki kareyi çok az sil (feedback izi)
    ctx.fillStyle = 'rgba(4,4,12,0.09)';
    ctx.fillRect(0, 0, W, H);
    // Frekans verisi
    let aData = null, avg = 0;
    if (_analyser && _analyserData) {
      _analyser.getByteFrequencyData(_analyserData);
      aData = _analyserData;
      avg = aData.reduce((a,b)=>a+b,0) / aData.length / 255;
    }
    // Plasma: her pikselde 4 sinüs dalgasının girişimi (Hydra osc().add().modulate() benzeri)
    for (let xi = 0; xi < W; xi++) {
      const nx   = xi / W;                                              // 0..1
      const band = aData ? aData[Math.floor(nx * aData.length)] / 255 : 0;
      // Dört bağımsız sinüs — frekans + zaman + ses modülasyonu
      const v1 = Math.sin(nx * 10 * Math.PI + _t * 0.025);
      const v2 = Math.sin(nx *  6 * Math.PI - _t * 0.042 + avg * 5 + band * 2.5);
      const v3 = Math.sin(nx * 21 * Math.PI + _t * 0.014 + band * 4.2);
      const v4 = Math.sin(nx * nx * 28       + _t * 0.033 + avg * 3.5);
      const v  = (v1 + v2 + v3 + v4) / 4;                             // girişim toplamı
      // Renk: elektrik mavisi / cyan paleti, ses ile kayar
      const hue = (195 + v * 38 + band * 58 + _t * 0.14) % 360;
      const sat = 82 + band * 18;
      const lit = 16 + Math.abs(v) * 34 + band * 40 + avg * 20;
      const alf = 0.32 + Math.abs(v) * 0.48 + band * 0.28;
      // Dikey çubuk — yükseklik ve merkez ses + dalga ile modüle
      const barH = H * (0.10 + Math.abs(v) * 0.58 + band * 0.40 + avg * 0.14);
      const cy   = H * 0.5 + v * H * 0.24;
      ctx.fillStyle = `hsla(${hue},${sat}%,${lit}%,${alf})`;
      ctx.fillRect(xi, cy - barH * 0.5, 1.5, barH);
    }
    _t++;
  })();
}

// ── Web Audio sentez ──────────────────────────────────────────────────
let _audioCtx = null, _analyser = null, _analyserData = null;

function initTermAudio() {
  if (_audioCtx) return;
  try {
    _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    _analyser = _audioCtx.createAnalyser();
    _analyser.fftSize = 256;
    _analyserData = new Uint8Array(_analyser.frequencyBinCount);
    _analyser.connect(_audioCtx.destination);
  } catch(e) {}
}

function playTermTone(snippetIdx) {
  if (!_audioCtx || !_analyser) return;
  const now = _audioCtx.currentTime;
  const isScLang = LIVECODE_SNIPPETS[snippetIdx].lang === 'sc';

  // Melodik akorlar: Am7 – Fmaj7 – C – G ve varyantları
  const phrases = [
    { chords: [[220,277,330,415],[174,220,261,349],[261,329,392],[196,247,294,392]], dur:0.32 },
    { chords: [[196,247,294,370],[220,277,330],[261,329,392,523],[174,220,261]], dur:0.28 },
    { chords: [[220],[247],[294],[330],[392],[440],[392],[330]], dur:0.2  },
    { chords: [[174,220,261,349],[196,261,311],[220,277,330,440],[261,329,392]], dur:0.36 },
    { chords: [[233,293,349,440],[246,311,369],[261,329,392,523],[220,277,330]], dur:0.3  },
  ];
  const phrase = phrases[snippetIdx % phrases.length];

  phrase.chords.forEach((chord, ci) => {
    const t = now + ci * phrase.dur;
    chord.forEach(freq => {
      const osc   = _audioCtx.createOscillator();
      const gain  = _audioCtx.createGain();
      const filt  = _audioCtx.createBiquadFilter();
      osc.type = isScLang ? 'sine' : 'triangle';
      osc.frequency.value = freq;
      filt.type = 'lowpass';
      filt.frequency.setValueAtTime(1200 + freq * 1.5, t);
      filt.Q.value = 0.8;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.07 / chord.length, t + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.001, t + phrase.dur * 0.9);
      osc.connect(filt); filt.connect(gain); gain.connect(_analyser);
      osc.start(t); osc.stop(t + phrase.dur);
    });
  });
}

// ── Canvas dalga animasyonu ────────────────────────────────────────────
let _mx = 0.5, _my = 0.5;

function initHomeCanvas() {
  const c = document.getElementById('homeCanvas');
  if (!c) return;
  const ctx = c.getContext('2d');
  function resize() { c.width = window.innerWidth; c.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);
  document.addEventListener('mousemove', e => {
    _mx = e.clientX / window.innerWidth;
    _my = e.clientY / window.innerHeight;
  });
  const waves = [
    {f:2.2, a:0.13, sp:0.5,  r:0,  g:170,b:255, lw:2.0},
    {f:3.5, a:0.08, sp:0.85, r:0,  g:220,b:255, lw:1.5},
    {f:5.1, a:0.05, sp:1.4,  r:80, g:240,b:255, lw:1.0},
    {f:7.0, a:0.03, sp:2.1,  r:0,  g:140,b:210, lw:0.8},
  ];
  let t = 0;
  (function draw() {
    ctx.clearRect(0, 0, c.width, c.height);
    // Audio-reactive boost
    let audioBoost = 0;
    if (_analyser && _analyserData) {
      _analyser.getByteFrequencyData(_analyserData);
      audioBoost = _analyserData.reduce((a,b)=>a+b,0) / _analyserData.length / 128;
    }
    waves.forEach((w, i) => {
      ctx.beginPath();
      const alpha = 0.55 + _my * 0.2 + audioBoost * 0.25;
      ctx.strokeStyle = `rgba(${w.r},${w.g},${w.b},${Math.min(alpha, 0.9)})`;
      ctx.lineWidth = w.lw + audioBoost * 1.2;
      ctx.shadowColor = `rgba(${w.r},${w.g},${w.b},0.5)`;
      ctx.shadowBlur = 8 + audioBoost * 16;
      const freq = w.f * (0.75 + _mx * 0.55);
      const amp  = c.height * (w.a + _my * 0.025 + audioBoost * 0.06);
      const ph   = t * w.sp * 0.001 + i * 0.9;
      for (let x = 0; x <= c.width; x += 2) {
        const y = c.height * 0.5 + Math.sin((x / c.width) * Math.PI * freq + ph) * amp;
        x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.shadowBlur = 0;
    });
    t++;
    requestAnimationFrame(draw);
  })();
}

  const el = document.querySelector(`[data-page="${id}"]`);
  if (el) el.classList.add('active');
  page = id;
  closeNav();
  const c = document.getElementById('homeCanvas');
  if (c) c.style.opacity = id === 'home' ? '0.45' : '0.05';
  if (id === 'home' && !_termStarted) { _termStarted = true; typeTerminal(); }
  // URL hash güncelle
  const newHash = id === 'home' ? '' : '#' + id;
  const cur = window.location.hash;
  if (cur !== newHash && cur !== ('#' + id)) {
    if (push) {
      history.pushState({ page: id }, '', newHash || window.location.pathname);
    } else {
      history.replaceState({ page: id }, '', newHash || window.location.pathname);
    }
  }
}

// ── YouTube embed dönüştürücü ──────────────────────────────────────────
function toEmbed(url) {
  if (!url) return null;
  let m = url.match(/youtu\.be\/([^?&]+)/);
  if (m) return `https://www.youtube.com/embed/${m[1]}?autoplay=1`;
  m = url.match(/[?&]v=([^&]+)/);
  if (m) return `https://www.youtube.com/embed/${m[1]}?autoplay=1`;
  m = url.match(/list=([^&]+)/);
  if (m) return `https://www.youtube.com/embed/videoseries?list=${m[1]}&autoplay=1`;
  return null;
}

function toSpotifyEmbed(url) {
  if (!url) return null;
  const m = url.match(/open\.spotify\.com\/(track|album|playlist)\/([A-Za-z0-9]+)/);
  if (m) return `https://open.spotify.com/embed/${m[1]}/${m[2]}`;
  return null;
}

function playItem(el, title, ytUrl, spotifyUrl) {
  const ytEmbed = toEmbed(ytUrl);
  const spEmbed = toSpotifyEmbed(spotifyUrl);
  const embed = ytEmbed || spEmbed;
  const isSpotify = !ytEmbed && !!spEmbed;
  if (!embed) return;
  const player = document.getElementById('musicPlayer');
  const frame = document.querySelector('.music-player-frame');
  const iframe = document.getElementById('musicIframe');
  iframe.src = embed;
  iframe.allow = isSpotify
    ? 'autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture'
    : 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
  frame.style.aspectRatio = isSpotify ? 'unset' : '16/9';
  frame.style.height = isSpotify ? '152px' : '';
  document.getElementById('musicPlayerLabel').textContent = title + ' — ' + t().music.playLabel;
  // tıklanan öğenin hemen altına taşı
  el.after(player);
  player.classList.add('open');
  player.scrollIntoView({ behavior:'smooth', block:'nearest' });
}
function closePlayer() {
  document.getElementById('musicIframe').src = '';
  document.getElementById('musicPlayer').classList.remove('open');
}

function setMusicFilter(cat) {
  musicFilter = cat;
  closePlayer();
  document.querySelectorAll('.music-filter').forEach(b =>
    b.classList.toggle('active', b.dataset.cat === cat));
  renderMusicList();
}

function setMusicMode(mode) {
  musicMode = mode;
  closePlayer();
  const label = mode === 'live' ? 'Live Performans' : 'Streaming';
  document.querySelectorAll('.music-mode-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.mode === mode));
  // Desktop label + dropdown kapat
  const lbl = document.getElementById('musicModeLabel');
  if (lbl) lbl.textContent = label;
  const ddWrap = document.querySelector('.music-dd-wrap');
  if (ddWrap) ddWrap.classList.remove('open');
  // Mobile label + kapat accordion
  const mLbl = document.getElementById('musicMobileLbl');
  if (mLbl) mLbl.textContent = label;
  const opts = document.getElementById('musicToggleOpts');
  const plus = document.querySelector('.music-toggle-plus');
  if (opts) opts.classList.remove('open');
  if (plus) plus.textContent = '+';
  renderMusicList();
}

function toggleMusicDd() {
  const wrap = document.querySelector('.music-dd-wrap');
  if (!wrap) return;
  wrap.classList.toggle('open');
}


function toggleMusicAccordion() {
  const opts = document.getElementById('musicToggleOpts');
  const plus = document.querySelector('.music-toggle-plus');
  if (!opts) return;
  const isOpen = opts.classList.toggle('open');
  if (plus) plus.textContent = isOpen ? '×' : '+';
}

function musicItemHtml(item, d) {
  const hasVideo = !!toEmbed(item.yt) || !!toSpotifyEmbed(item.spotify);
  const esc = s => s.replace(/'/g, "\\'");
  return `
  <div class="music-item${hasVideo ? '' : ' no-video'}"
    ${hasVideo ? `onclick="playItem(this,'${esc(item.title)}','${esc(item.yt||'')}','${esc(item.spotify||'')}')"` : ''}>
    <div class="music-play">${hasVideo ? '▶' : '·'}</div>
    <div class="music-info">
      <div class="music-title">${item.title}</div>
      <div class="music-by">${item.by}</div>
      <div class="music-bottom">
        <span class="music-cat-tag">${d.music.catLabels[item.cat] || ''}</span>
        <div class="music-links">
          ${item.yt ? `<a class="music-link-btn" href="${item.yt}" target="_blank" onclick="event.stopPropagation()">YouTube ↗</a>` : ''}
          ${item.spotify ? `<a class="music-link-btn" href="${item.spotify}" target="_blank" onclick="event.stopPropagation()">Spotify ↗</a>` : ''}
          ${item.apple ? `<a class="music-link-btn" href="${item.apple}" target="_blank" onclick="event.stopPropagation()">Apple Music ↗</a>` : ''}
        </div>
      </div>
    </div>
    <div class="music-year">${item.year}</div>
  </div>`;
}

function renderMusicList() {
  const d = t();
  const list = document.querySelector('.music-list');

  if (musicMode === 'live') {
    list.innerHTML = MUSIC_ITEMS.filter(i => i.cat === 'live')
      .map(item => musicItemHtml(item, d)).join('');
    return;
  }

  // Streaming: Single → EP → Yer Aldığı Albüm şeklinde grupla
  const order = ['single', 'ep', 'album'];
  list.innerHTML = order.map(cat => {
    const catItems = MUSIC_ITEMS.filter(i => i.cat === cat);
    if (!catItems.length) return '';
    return `<div class="music-cat-header">${d.music.catLabels[cat]}</div>`
      + catItems.map(item => musicItemHtml(item, d)).join('');
  }).join('');
}

      </div>
      <div class="music-toggle-opts" id="musicToggleOpts">
        <button class="music-mode-btn${musicMode==='streaming'?' active':''}" data-mode="streaming" onclick="setMusicMode('streaming')">Streaming</button>
        <button class="music-mode-btn${musicMode==='live'?' active':''}" data-mode="live" onclick="setMusicMode('live')">Live Performans</button>
      </div>
    </div>`;
  renderMusicList();
  // Blog
  document.querySelector('.blog-soon').textContent = d.blog;
  // İletişim
  document.querySelector('.contact-intro').innerHTML = d.contact.intro;
  const em = d.contact.email;
  document.getElementById('contactEmail').innerHTML = `
    <a class="contact-email-block" href="${em.href}">
      ${platformIcon('Email')}
      <span class="contact-email-addr">${em.addr}</span>
      <span class="contact-email-arrow">→</span>
    </a>`;
  document.getElementById('contactLower').innerHTML = d.contact.groups.map(g=>`
    <div class="contact-group">
      <div class="contact-group-label">${upper(g.label,lang)}</div>
      ${g.links.map(l=>`
        <a class="contact-link" href="${l.href}" target="_blank">
          <span class="contact-link-left">${platformIcon(l.text)}<span>${l.text}</span></span>
          <span class="contact-link-sub">${l.sub}</span>
        </a>`).join('')}
    </div>`).join('');
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('langModalGrid').innerHTML = LANGS.map(l =>
    `<div class="lang-modal-item${l.code==='tr'?' active':''}" data-lang="${l.code}" onclick="setLang('${l.code}')">
      <span class="lang-modal-flag">${l.flag}</span>
      <span>${l.name}</span>
    </div>`
  ).join('');
  const cur = LANGS.find(l => l.code === 'tr');
  document.getElementById('langTriggerFlag').textContent = cur.flag;
  document.getElementById('langTriggerName').textContent = cur.name;
  document.getElementById('navToggle').addEventListener('click', openNav);
  document.getElementById('navOverlay').addEventListener('click', closeNav);
  initHomeCanvas();
  initTermViz();
  render();
  // Sayfa yenilenince hash'ten başlangıç sayfasını oku (history'ye ekleme)
  const hashPage = window.location.hash.slice(1);
  showPage(pages.includes(hashPage) ? hashPage : 'home', false);
  // Geri/ileri buton desteği — history'ye ekleme, sadece göster
  window.addEventListener('popstate', e => {
    const h = (e.state && e.state.page) || window.location.hash.slice(1);
    showPage(pages.includes(h) ? h : 'home', false);
  });
});
</script>
</body>
</html>
