<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0b0b0b;--surface:#131313;--border:#242424;--border2:#2e2e2e;
  --text:#e2ddd6;--text-muted:#706b64;--text-dim:#4a4540;
  --accent:#c4956a;--accent-dim:#7a5c3f;
  --font-d:'Cormorant Garamond',Georgia,serif;
  --font-m:'IBM Plex Mono',monospace;
  --nav-h:64px;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--font-m);font-weight:300;font-size:13px;line-height:1.7;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:999;opacity:.6}

/* ─── MASAÜSTÜ: üst yatay nav ─── */
nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);border-bottom:1px solid var(--border);display:flex;flex-direction:row;align-items:center;padding:0 48px;z-index:100;background:var(--bg);gap:24px}
.nav-logo{cursor:pointer;flex-shrink:0}
.nav-logo-img{max-width:130px;height:auto;display:block;opacity:.85;transition:opacity .2s}
.nav-logo-img:hover{opacity:1}
.nav-links{margin-left:auto;display:flex;flex-direction:row;gap:0;list-style:none}
.nav-links a{font-family:var(--font-m);font-size:10px;font-weight:300;color:var(--text-muted);text-decoration:none;letter-spacing:.1em;padding:8px 14px;transition:color .2s;cursor:pointer;display:block}
.nav-links a:hover,.nav-links a.active{color:var(--text)}
.nav-links a.active{color:var(--accent)}
.lang-sw{display:flex;gap:6px;flex-shrink:0}
.lang-btn{font-family:var(--font-m);font-size:9px;letter-spacing:.15em;color:var(--text-dim);background:none;border:1px solid var(--border);padding:4px 8px;cursor:pointer;transition:all .2s}
.lang-btn:hover,.lang-btn.active{color:var(--accent);border-color:var(--accent-dim)}
.nav-bottom{display:none}
.nav-hamburger{display:none}
.nav-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:150}
.nav-overlay.open{display:block}

/* ─── MAIN ─── */
main{padding-top:var(--nav-h);min-height:100vh}
.page{display:none;padding:64px 80px;min-height:calc(100vh - var(--nav-h));animation:fadein .4s ease}
.page.active{display:block}
#home{display:none}
#home.active{display:flex;flex-direction:column;justify-content:center;padding-top:80px;padding-bottom:80px;min-height:calc(100vh - var(--nav-h))}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.home-eyebrow{font-family:var(--font-m);font-size:10px;color:var(--accent);letter-spacing:.2em;margin-bottom:24px}
.home-name{font-family:var(--font-d);font-size:clamp(56px,8vw,110px);font-weight:300;color:var(--text);line-height:.9;letter-spacing:-.02em;margin-bottom:40px}
.home-name em{font-style:italic;color:var(--accent)}
.home-tagline{font-family:var(--font-m);font-size:11px;color:var(--text-muted);letter-spacing:.1em;display:flex;gap:24px;flex-wrap:wrap}
.home-tagline span::before{content:'— ';color:var(--accent)}
.home-waveform{position:fixed;bottom:0;right:0;width:100%;height:120px;opacity:.06;pointer-events:none}

.section-label{font-family:var(--font-m);font-size:10px;color:var(--accent);letter-spacing:.2em;margin-bottom:40px;display:flex;align-items:center;gap:16px}
.section-label::after{content:'';flex:1;max-width:60px;height:1px;background:var(--border2)}

.about-text{font-family:var(--font-d);font-size:21px;font-weight:300;color:var(--text);line-height:1.8;max-width:720px}
.about-text strong{font-weight:500;color:var(--accent)}
.about-text em{font-style:italic;color:var(--text-muted)}
.about-meta{margin-top:56px;display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--border);border:1px solid var(--border);max-width:720px}
.meta-item{background:var(--bg);padding:24px 28px}
.meta-label{font-family:var(--font-m);font-size:9px;color:var(--text-dim);letter-spacing:.18em;margin-bottom:8px}
.meta-value{font-family:var(--font-d);font-size:16px;font-weight:400;color:var(--text);line-height:1.6}

.works-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--border);border:1px solid var(--border);max-width:900px}
.work-item{background:var(--bg);padding:32px 36px;transition:background .2s}
.work-item:hover{background:var(--surface)}
.work-type{font-family:var(--font-m);font-size:9px;color:var(--accent);letter-spacing:.18em;margin-bottom:12px;text-transform:uppercase}
.work-title{font-family:var(--font-d);font-size:24px;font-weight:400;font-style:italic;color:var(--text);margin-bottom:8px;line-height:1.2}
.work-role{font-family:var(--font-m);font-size:11px;color:var(--text-muted);margin-bottom:16px}
.work-desc{font-family:var(--font-m);font-size:11px;color:var(--text-dim);line-height:1.6}
.work-badge{display:inline-block;margin-top:16px;font-family:var(--font-m);font-size:9px;letter-spacing:.15em;color:var(--accent);border:1px solid var(--accent-dim);padding:4px 10px;text-transform:uppercase}

/* Müzik filtreleri */
.music-filters{display:flex;gap:1px;background:var(--border);border:1px solid var(--border);border-bottom:none;max-width:800px;flex-wrap:wrap}
.music-filter{font-family:var(--font-m);font-size:9px;letter-spacing:.15em;color:var(--text-dim);background:var(--bg);padding:12px 20px;cursor:pointer;border:none;text-transform:uppercase;transition:all .2s}
.music-filter:hover{color:var(--text);background:var(--surface)}
.music-filter.active{color:var(--accent);background:var(--surface)}
.music-list{display:flex;flex-direction:column;gap:1px;background:var(--border);border:1px solid var(--border);max-width:800px}
.music-item{background:var(--bg);padding:24px 36px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:start;transition:background .2s;text-decoration:none;color:inherit}
.music-item:hover{background:var(--surface)}
.music-title{font-family:var(--font-d);font-size:20px;font-weight:400;font-style:italic;color:var(--text);margin-bottom:4px}
.music-by{font-family:var(--font-m);font-size:11px;color:var(--text-muted);margin-bottom:6px}
.music-cat-tag{font-family:var(--font-m);font-size:9px;color:var(--text-dim);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.music-links{display:flex;gap:8px;flex-wrap:wrap}
.music-link-btn{font-family:var(--font-m);font-size:9px;letter-spacing:.1em;color:var(--accent);border:1px solid var(--accent-dim);padding:3px 9px;text-decoration:none;text-transform:uppercase;transition:all .2s}
.music-link-btn:hover{background:var(--accent);color:var(--bg)}
.music-year{font-family:var(--font-m);font-size:11px;color:var(--text-dim);text-align:right;white-space:nowrap}

.exh-list{display:flex;flex-direction:column;gap:40px;max-width:780px}
.exh-item{display:grid;grid-template-columns:90px 1fr;gap:32px;padding-bottom:40px;border-bottom:1px solid var(--border)}
.exh-item:last-child{border-bottom:none;padding-bottom:0}
.exh-year{font-family:var(--font-m);font-size:11px;color:var(--accent);padding-top:6px}
.exh-title{font-family:var(--font-d);font-size:22px;font-weight:400;font-style:italic;color:var(--text);margin-bottom:6px;line-height:1.3}
.exh-venue{font-family:var(--font-m);font-size:10px;color:var(--text-dim);margin-bottom:10px}
.exh-roles{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.exh-role{font-family:var(--font-m);font-size:9px;letter-spacing:.12em;color:var(--accent);border:1px solid var(--accent-dim);padding:3px 9px;text-transform:uppercase}
.exh-desc{font-family:var(--font-m);font-size:11px;color:var(--text-dim);line-height:1.7}

.blog-soon{font-family:var(--font-d);font-size:22px;color:var(--text-muted);font-style:italic;padding:60px 0}

.contact-intro{font-family:var(--font-d);font-size:28px;font-weight:300;color:var(--text);line-height:1.5;margin-bottom:56px;max-width:520px}
.contact-intro em{font-style:italic;color:var(--accent)}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:60px;max-width:700px}
.contact-group-label{font-family:var(--font-m);font-size:9px;color:var(--text-dim);letter-spacing:.18em;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--border);text-transform:uppercase}
.contact-link{display:block;font-family:var(--font-d);font-size:18px;font-weight:400;color:var(--text-muted);text-decoration:none;padding:10px 0;transition:color .2s;border-bottom:1px solid var(--border)}
.contact-link:hover{color:var(--accent)}
.contact-link span{font-family:var(--font-m);font-size:10px;color:var(--text-dim);display:block;margin-top:2px}

/* ─── MOBİL: hamburger + sol sidebar ─── */
@media(max-width:860px){
  nav{
    position:fixed;top:0;left:-240px;width:220px;height:100vh;
    flex-direction:column;align-items:flex-start;
    padding:48px 32px;border-right:1px solid var(--border);border-bottom:none;
    gap:0;transition:left .3s ease;z-index:200;right:auto;
  }
  nav.open{left:0}
  .nav-logo{margin-bottom:8px}
  .nav-links{
    margin-left:0;margin-top:36px;
    flex-direction:column;gap:2px;
  }
  .nav-links a{
    display:flex;align-items:center;gap:10px;
    padding:7px 0;font-size:11px;
  }
  .nav-links a::before{
    content:'';width:16px;height:1px;
    background:var(--text-dim);
    transition:width .2s,background .2s;flex-shrink:0;
  }
  .nav-links a.active::before,.nav-links a:hover::before{width:28px;background:var(--accent)}
  .lang-sw{margin-top:28px}
  .nav-bottom{
    display:block;margin-top:auto;
    font-size:10px;color:var(--text-dim);letter-spacing:.08em;
  }
  .nav-bottom a{color:var(--text-dim);text-decoration:none;transition:color .2s}
  .nav-bottom a:hover{color:var(--accent)}
  .nav-hamburger{
    display:flex;flex-direction:column;justify-content:center;
    align-items:center;gap:5px;
    position:fixed;top:16px;right:16px;z-index:300;
    width:40px;height:40px;
    background:var(--bg);border:1px solid var(--border);
    cursor:pointer;
  }
  .nav-hamburger span{display:block;width:18px;height:1px;background:var(--text)}
  main{padding-top:0}
  .page{padding:56px 24px 40px}
  #home.active{justify-content:flex-start;padding-top:72px;padding-bottom:48px;min-height:100vh}
  .home-name{font-size:clamp(44px,12vw,72px)}
  .works-grid{grid-template-columns:1fr}
  .contact-grid{grid-template-columns:1fr}
  .about-meta{grid-template-columns:1fr}
  .exh-item{grid-template-columns:1fr;gap:8px}
  .music-filter{padding:10px 14px}
}
</style>
</head>

// ── Durum ──────────────────────────────────────────────────────────────
let lang = 'tr', page = 'home', musicFilter = 'all';
const t = () => SITE[lang];
const pages = ['home','about','works','music','exhibitions','blog','contact'];

function upper(str, l) {
  if (l === 'tr') return str.toLocaleUpperCase('tr-TR');
  return str.toUpperCase();
}

// ── Sayfa geçişi ───────────────────────────────────────────────────────
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  const el = document.querySelector(`[data-page="${id}"]`);
  if (el) el.classList.add('active');
  page = id;
  closeNav();
}

// ── Dil ────────────────────────────────────────────────────────────────
function setLang(l) {
  lang = l;
  document.documentElement.lang = l;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === l));
  render(); showPage(page);
}

// ── Hamburger menü ─────────────────────────────────────────────────────
function openNav() {
  document.getElementById('mainNav').classList.add('open');
  document.getElementById('navOverlay').classList.add('open');
}
function closeNav() {
  document.getElementById('mainNav').classList.remove('open');
  document.getElementById('navOverlay').classList.remove('open');
}

// ── Müzik filtresi ─────────────────────────────────────────────────────
function setMusicFilter(cat) {
  musicFilter = cat;
  document.querySelectorAll('.music-filter').forEach(b =>
    b.classList.toggle('active', b.dataset.cat === cat));
  renderMusicList();
}

function renderMusicList() {
  const d = t();
  const items = musicFilter === 'all'
    ? MUSIC_ITEMS
    : MUSIC_ITEMS.filter(i => i.cat === musicFilter);
  document.querySelector('.music-list').innerHTML = items.map(item => `
    <div class="music-item">
      <div>
        <div class="music-title">${item.title}</div>
        <div class="music-by">${item.by}</div>
        <div class="music-cat-tag">${d.music.catLabels[item.cat] || item.cat}</div>
        <div class="music-links">
          ${item.url ? `<a class="music-link-btn" href="${item.url}" target="_blank">YouTube</a>` : ''}
          ${item.url2 ? `<a class="music-link-btn" href="${item.url2}" target="_blank">Spotify</a>` : ''}
        </div>
      </div>
      <div class="music-year">${item.year}</div>
    </div>`).join('');
}

// ── Render ─────────────────────────────────────────────────────────────
function render() {
  const d = t();
  // Nav
  document.querySelector('.nav-links').innerHTML = pages.map((p,i) =>
    `<li><a onclick="showPage('${p}')" data-page="${p}">${d.nav[i]}</a></li>`).join('');
  // Bölüm etiketleri
  ['about','works','music','exhibitions','blog','contact'].forEach((id,i) => {
    const el = document.getElementById(`lbl-${id}`);
    if (el) el.textContent = upper(d.nav[i+1], lang);
  });
  // Ana sayfa
  document.querySelector('.home-eyebrow').textContent = d.home.location;
  document.querySelector('.home-tagline').innerHTML = d.home.roles.map(r=>`<span>${r}</span>`).join('');
  // Hakkımda
  document.querySelector('.about-text').innerHTML = d.about.text;
  document.querySelectorAll('.meta-item').forEach((el,i) => {
    el.querySelector('.meta-label').textContent = upper(d.about.metaLabels[i], lang);
    el.querySelector('.meta-value').innerHTML = d.about.meta[i];
  });
  // İşler
  document.querySelector('.works-grid').innerHTML = d.works.map(w=>`
    <div class="work-item">
      <div class="work-type">${w.type}</div>
      <div class="work-title">${w.title}</div>
      <div class="work-role">${w.role}</div>
      <div class="work-desc">${w.desc}</div>
      ${w.badge?`<div class="work-badge">${w.badge}</div>`:''}
    </div>`).join('');
  // Müzik filtreleri
  document.querySelector('.music-filters').innerHTML = d.music.filters.map(f =>
    `<button class="music-filter${f.cat===musicFilter?' active':''}" data-cat="${f.cat}" onclick="setMusicFilter('${f.cat}')">${upper(f.label,lang)}</button>`
  ).join('');
  renderMusicList();
  // Sergiler
  document.querySelector('.exh-list').innerHTML = d.exhibitions.map(e=>`
    <div class="exh-item">
      <div class="exh-year">${e.year}</div>
      <div>
        <div class="exh-title">${e.title}</div>
        <div class="exh-venue">${e.venue}</div>
        <div class="exh-roles">${e.roles.map(r=>`<span class="exh-role">${upper(r,lang)}</span>`).join('')}</div>
        <div class="exh-desc">${e.desc}</div>
      </div>
    </div>`).join('');
  // Blog
  document.querySelector('.blog-soon').textContent = d.blog;
  // İletişim
  document.querySelector('.contact-intro').innerHTML = d.contact.intro;
  document.querySelector('.contact-grid').innerHTML = d.contact.groups.map(g=>`
    <div class="contact-group">
      <div class="contact-group-label">${upper(g.label,lang)}</div>
      ${g.links.map(l=>`<a class="contact-link" href="${l.href}" target="_blank">${l.text}<span>${l.sub}</span></a>`).join('')}
    </div>`).join('');
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('navToggle').addEventListener('click', openNav);
  document.getElementById('navOverlay').addEventListener('click', closeNav);
  render();
  showPage('home');
});
</script>
