*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{

html{scroll-behavior:smooth}

nav{position:fixed;top:0;left:0;width:var(--nav-w);height:100vh;border-right:1px solid var(--border);display:flex;flex-direction:column;padding:48px 32px;z-index:100;background:var(--bg)}
.nav-logo{cursor:pointer;margin-bottom:8px}
.nav-logo-img{max-width:170px;height:auto;display:block;opacity:.9;transition:opacity .2s}
.nav-logo-img:hover{opacity:1}
.nav-logo-sub{display:block;font-family:var(--font-m);font-size:10px;font-weight:300;color:var(--accent);letter-spacing:.15em;margin-top:4px}
.nav-links{margin-top:36px;display:flex;flex-direction:column;gap:2px;list-style:none}
.nav-links a{font-family:var(--font-m);font-size:11px;font-weight:300;color:var(--text-muted);text-decoration:none;letter-spacing:.1em;padding:7px 0;transition:color .2s;cursor:pointer;display:flex;align-items:center;gap:10px}
.nav-links a::before{content:'';width:16px;height:1px;background:var(--text-dim);transition:width .2s,background .2s;flex-shrink:0}

.nav-links a.active::before,.nav-links a:hover::before{width:28px;background:var(--accent)}
.lang-sw{margin-top:28px;display:flex;gap:6px}
.lang-btn{font-family:var(--font-m);font-size:9px;letter-spacing:.15em;color:var(--text-dim);background:none;border:1px solid var(--border);padding:4px 8px;cursor:pointer;transition:all .2s}
.lang-btn:hover,.lang-btn.active{color:var(--accent);border-color:var(--accent-dim)}
.nav-bottom{margin-top:auto;font-size:10px;color:var(--text-dim);letter-spacing:.08em}
.nav-bottom a{color:var(--text-dim);text-decoration:none;transition:color .2s}
.nav-bottom a:hover{color:var(--accent)}
main{margin-left:var(--nav-w);min-height:100vh}
.page{display:none;padding:72px 72px 72px 80px;min-height:100vh;animation:fadein .4s ease}
.page.active{display:block}
#home{display:none}
#home.active{display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:80px}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.home-eyebrow{font-family:var(--font-m);font-size:10px;color:var(--accent);letter-spacing:.2em;margin-bottom:24px}
.home-name{font-family:var(--font-d);font-size:clamp(56px,8vw,110px);font-weight:300;color:var(--text);line-height:.9;letter-spacing:-.02em;margin-bottom:40px}
.home-name em{font-style:italic;color:var(--accent)}
.home-tagline{font-family:var(--font-m);font-size:11px;color:var(--text-muted);letter-spacing:.1em;display:flex;gap:24px;flex-wrap:wrap}
.home-tagline span::before{content:'— ';color:var(--accent)}
.home-waveform{position:fixed;bottom:0;right:0;width:calc(100% - var(--nav-w));height:120px;opacity:.06;pointer-events:none}
.section-label{font-family:var(--font-m);font-size:10px;color:var(--accent);letter-spacing:.2em;margin-bottom:40px;display:flex;align-items:center;gap:16px}
.section-label::after{content:'';flex:1;max-width:60px;height:1px;background:var(--border2)}
.about-text{font-family:var(--font-d);font-size:21px;font-weight:300;color:var(--text);line-height:1.8;max-width:720px}
.about-text strong{font-weight:500;color:var(--accent)}
.about-text em{font-style:italic;color:var(--text-muted)}
.about-meta{margin-top:56px;display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--border);border:1px solid var(--border);max-width:720px}
.meta-item{background:var(--bg);padding:24px 28px}
.meta-label{font-family:var(--font-m);font-size:9px;color:var(--text-dim);letter-spacing:.18em;margin-bottom:8px}
.meta-value{font-family:var(--font-d);font-size:16px;font-weight:400;color:var(--text)}
.works-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--border);border:1px solid var(--border);max-width:900px}
.work-item{background:var(--bg);padding:32px 36px;transition:background .2s}

.work-role{font-family:var(--font-m);font-size:11px;color:var(--text-muted);margin-bottom:16px}
.work-desc{font-family:var(--font-m);font-size:11px;color:var(--text-dim);line-height:1.6}
.work-badge{display:inline-block;margin-top:16px;font-family:var(--font-m);font-size:9px;letter-spacing:.15em;color:var(--accent);border:1px solid var(--accent-dim);padding:4px 10px;text-transform:uppercase}
.music-list{display:flex;flex-direction:column;gap:1px;background:var(--border);border:1px solid var(--border);max-width:800px}
.music-section-title{font-family:var(--font-m);font-size:10px;color:var(--text-dim);letter-spacing:.18em;padding:14px 36px;background:var(--surface);text-transform:uppercase}
.music-item{background:var(--bg);padding:24px 36px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:start;transition:background .2s;text-decoration:none;color:inherit}
.music-item:hover{background:var(--surface)}
.music-title{font-family:var(--font-d);font-size:20px;font-weight:400;font-style:italic;color:var(--text);margin-bottom:4px}
.music-by{font-family:var(--font-m);font-size:11px;color:var(--text-muted);margin-bottom:4px}
.music-role-tag{font-family:var(--font-m);font-size:9px;color:var(--text-dim);letter-spacing:.1em;text-transform:uppercase}
.music-year{font-family:var(--font-m);font-size:11px;color:var(--text-dim);text-align:right;white-space:nowrap}
.exh-list{display:flex;flex-direction:column;gap:40px;max-width:780px}
.exh-item{display:grid;grid-template-columns:90px 1fr;gap:32px;padding-bottom:40px;border-bottom:1px solid var(--border)}
.exh-item:last-child{border-bottom:none;padding-bottom:0}
.exh-year{font-family:var(--font-m);font-size:11px;color:var(--accent);padding-top:6px}
.exh-title{font-family:var(--font-d);font-size:22px;font-weight:400;font-style:italic;color:var(--text);margin-bottom:6px;line-height:1.3}
.exh-venue{font-family:var(--font-m);font-size:10px;color:var(--text-dim);margin-bottom:10px}
.exh-roles{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.exh-role{font-family:var(--font-m);font-size:9px;letter-spacing:.12em;color:var(--accent);border:1px solid var(--accent-dim);padding:3px 9px;text-transform:uppercase}

.blog-soon{font-family:var(--font-d);font-size:22px;color:var(--text-muted);font-style:italic;padding:60px 0}
.contact-intro{font-family:var(--font-d);font-size:28px;font-weight:300;color:var(--text);line-height:1.5;margin-bottom:56px;max-width:520px}
.contact-intro em{font-style:italic;color:var(--accent)}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:60px;max-width:700px}

  .nav-bottom,.lang-sw{margin-top:0}

  .home-name{font-size:52px}
  .exh-item{grid-template-columns:1fr;gap:8px}
  #home.active{justify-content:flex-start;padding-top:64px;padding-bottom:48px}
  .nav-logo-img{max-width:140px}
}

// ════════════════════════════════════════════════════════════════
//  AŞAĞISINI DEĞİŞTİRME — Site motoru
// ════════════════════════════════════════════════════════════════
let lang = 'tr', page = 'home';
const t = () => SITE[lang];
const pages = ['home','about','works','music','exhibitions','blog','contact'];

// Türkçeye duyarlı büyük harf (i→İ, ı→I)
function upper(str, l) {
  if (l === 'tr') return str.toLocaleUpperCase('tr-TR');
  return str.toUpperCase();
}

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  const el = document.querySelector(`[data-page="${id}"]`);
  if (el) el.classList.add('active');
  page = id;
}

function setLang(l) {
  lang = l;
  document.documentElement.lang = l;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === l));
  render(); showPage(page);
}

function render() {
  const d = t();
  // NAV
  document.querySelector('.nav-links').innerHTML = pages.map((p,i) =>
    `<li><a onclick="showPage('${p}')" data-page="${p}">${d.nav[i]}</a></li>`).join('');
  // SECTION LABELS (uppercase via JS, locale-aware)
  ['about','works','music','exhibitions','blog','contact'].forEach((id,i) => {
    const el = document.getElementById(`lbl-${id}`);
    if (el) el.textContent = upper(d.nav[i+1], lang);
  });
  // HOME
  document.querySelector('.home-eyebrow').textContent = d.home.location;
  document.querySelector('.home-tagline').innerHTML = d.home.roles.map(r=>`<span>${r}</span>`).join('');
  // ABOUT
  document.querySelector('.about-text').innerHTML = d.about.text;
  document.querySelectorAll('.meta-item').forEach((el,i) => {
    el.querySelector('.meta-label').textContent = upper(d.about.metaLabels[i], lang);
    el.querySelector('.meta-value').innerHTML = d.about.meta[i];
  });
  // WORKS
  document.querySelector('.works-grid').innerHTML = d.works.map(w=>`
    <div class="work-item">
      <div class="work-type">${w.type}</div>
      <div class="work-title">${w.title}</div>
      <div class="work-role">${w.role}</div>
      <div class="work-desc">${w.desc}</div>
      ${w.badge?`<div class="work-badge">${w.badge}</div>`:''}
    </div>`).join('');
  // MUSIC
  document.querySelector('.music-list').innerHTML = d.music.sections.map(sec=>`
    <div class="music-section-title">${upper(sec.label, lang)}</div>
    ${sec.items.map(item=>`
      <${item.url?`a href="${item.url}" target="_blank"`:'div'} class="music-item">
        <div>
          <div class="music-title">${item.title}</div>
          <div class="music-by">${item.by}</div>
          <div class="music-role-tag">${upper(item.role, lang)}</div>
        </div>
        <div class="music-year">${item.year}</div>
      </${item.url?'a':'div'}>`).join('')}`).join('');
  // EXHIBITIONS
  document.querySelector('.exh-list').innerHTML = d.exhibitions.map(e=>`
    <div class="exh-item">
      <div class="exh-year">${e.year}</div>
      <div>
        <div class="exh-title">${e.title}</div>
        <div class="exh-venue">${e.venue}</div>
        <div class="exh-roles">${e.roles.map(r=>`<span class="exh-role">${upper(r,lang)}</span>`).join('')}</div>
        <div class="exh-desc">${e.desc}</div>
      </div>
    </div>`).join('');
  // BLOG
  document.querySelector('.blog-soon').textContent = d.blog;
  // CONTACT
  document.querySelector('.contact-intro').innerHTML = d.contact.intro;
  document.querySelector('.contact-grid').innerHTML = d.contact.groups.map(g=>`
    <div class="contact-group">
      <div class="contact-group-label">${upper(g.label,lang)}</div>
      ${g.links.map(l=>`<a class="contact-link" href="${l.href}" target="_blank">${l.text}<span>${l.sub}</span></a>`).join('')}
    </div>`).join('');
}

document.addEventListener('DOMContentLoaded', () => { render(); showPage('home'); });
</script>
