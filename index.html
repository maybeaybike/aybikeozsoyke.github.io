<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aybike Özsöyke</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,600&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0b0b0b;--surface:#131313;--border:#242424;--border2:#2e2e2e;
  --text:#e2ddd6;--text-muted:#706b64;--text-dim:#4a4540;
  --accent:#c4956a;--accent-dim:#7a5c3f;
  --font-d:'Cormorant Garamond',Georgia,serif;
  --font-m:'IBM Plex Mono',monospace;
  --nav-h:64px;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--font-m);font-weight:300;font-size:13px;line-height:1.7;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:999;opacity:.6}

/* ─── MASAÜSTÜ NAV ─── */
nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);border-bottom:1px solid var(--border);display:flex;flex-direction:row;align-items:center;padding:0 48px;z-index:100;background:var(--bg);gap:24px}
.nav-logo{cursor:pointer;flex-shrink:0}
.nav-logo-img{max-width:130px;height:auto;display:block;opacity:.85;transition:opacity .2s}
.nav-logo-img:hover{opacity:1}
.nav-links{margin-left:auto;display:flex;flex-direction:row;gap:0;list-style:none}
.nav-links a{font-family:var(--font-m);font-size:10px;font-weight:300;color:var(--text-muted);text-decoration:none;letter-spacing:.1em;padding:8px 14px;transition:color .2s;cursor:pointer;display:block}
.nav-links a:hover,.nav-links a.active{color:var(--text)}
.nav-links a.active{color:var(--accent)}
.lang-sw{display:flex;gap:6px;flex-shrink:0}
.lang-btn{font-family:var(--font-m);font-size:9px;letter-spacing:.15em;color:var(--text-dim);background:none;border:1px solid var(--border);padding:4px 8px;cursor:pointer;transition:all .2s}
.lang-btn:hover,.lang-btn.active{color:var(--accent);border-color:var(--accent-dim)}
.nav-bottom{display:none}
.nav-hamburger{display:none}
.nav-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:150}
.nav-overlay.open{display:block}

/* ─── MAIN ─── */
main{padding-top:var(--nav-h);min-height:100vh}
.page{display:none;padding:64px 80px;min-height:calc(100vh - var(--nav-h));animation:fadein .4s ease}
.page.active{display:block}
#home{display:none}
#home.active{display:flex;flex-direction:column;justify-content:center;padding-top:80px;padding-bottom:80px;min-height:calc(100vh - var(--nav-h))}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.home-eyebrow{font-family:var(--font-m);font-size:10px;color:var(--accent);letter-spacing:.2em;margin-bottom:24px}
.home-name{font-family:var(--font-d);font-size:clamp(56px,8vw,110px);font-weight:300;color:var(--text);line-height:.9;letter-spacing:-.02em;margin-bottom:40px}
.home-name em{font-style:italic;color:var(--accent)}
.home-tagline{font-family:var(--font-m);font-size:11px;color:var(--text-muted);letter-spacing:.1em;display:flex;gap:24px;flex-wrap:wrap}
.home-tagline span::before{content:'— ';color:var(--accent)}
.home-waveform{position:fixed;bottom:0;right:0;width:100%;height:120px;opacity:.06;pointer-events:none}

.section-label{font-family:var(--font-m);font-size:10px;color:var(--accent);letter-spacing:.2em;margin-bottom:48px;display:flex;align-items:center;gap:16px}
.section-label::after{content:'';flex:1;max-width:60px;height:1px;background:var(--border2)}

/* ─── HAKKIMDA: masaüstünde iki sütun ─── */
.about-layout{display:grid;grid-template-columns:1fr 360px;gap:72px;align-items:start;max-width:1100px}
.about-text{font-family:var(--font-d);font-size:21px;font-weight:300;color:var(--text);line-height:1.8}
.about-text strong{font-weight:500;color:var(--accent)}
.about-text em{font-style:italic;color:var(--text-muted)}
.about-right{display:flex;flex-direction:column;gap:0}
.about-photo{width:100%;aspect-ratio:1/1;object-fit:cover;object-position:center top;display:block}
.about-meta{display:flex;flex-direction:column;gap:1px;background:var(--border);border:1px solid var(--border)}
.meta-item{background:var(--bg);padding:24px 28px}
.meta-label{font-family:var(--font-m);font-size:9px;color:var(--text-dim);letter-spacing:.18em;margin-bottom:10px;text-transform:uppercase}
.meta-value{font-family:var(--font-d);font-size:17px;font-weight:400;color:var(--text);line-height:1.7}

/* ─── İŞLER ─── */
.works-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--border);border:1px solid var(--border);max-width:900px}
.work-item{background:var(--bg);padding:32px 36px;transition:background .2s}
.work-item:hover{background:var(--surface)}
.work-type{font-family:var(--font-m);font-size:9px;color:var(--accent);letter-spacing:.18em;margin-bottom:12px;text-transform:uppercase}
.work-title{font-family:var(--font-d);font-size:24px;font-weight:400;font-style:italic;color:var(--text);margin-bottom:8px;line-height:1.2}
.work-role{font-family:var(--font-m);font-size:11px;color:var(--text-muted);margin-bottom:16px}
.work-desc{font-family:var(--font-m);font-size:11px;color:var(--text-dim);line-height:1.6}
.work-badge{display:inline-block;margin-top:16px;font-family:var(--font-m);font-size:9px;letter-spacing:.15em;color:var(--accent);border:1px solid var(--accent-dim);padding:4px 10px;text-transform:uppercase}

/* ─── MÜZİK ─── */
.music-filters{display:flex;gap:1px;background:var(--border);border:1px solid var(--border);border-bottom:none;max-width:860px;flex-wrap:wrap}
.music-filter{font-family:var(--font-m);font-size:9px;letter-spacing:.12em;color:var(--text-dim);background:var(--bg);padding:12px 20px;cursor:pointer;border:none;transition:all .2s}
.music-filter:hover{color:var(--text);background:var(--surface)}
.music-filter.active{color:var(--accent);background:var(--surface)}
.music-list{display:flex;flex-direction:column;gap:1px;background:var(--border);border:1px solid var(--border);max-width:860px}
.music-item{background:var(--bg);padding:20px 32px;display:grid;grid-template-columns:36px 1fr auto;gap:18px;align-items:center;transition:background .2s;cursor:pointer}
.music-item:hover{background:var(--surface)}
.music-item.no-video{cursor:default}
.music-play{width:34px;height:34px;border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:9px;flex-shrink:0;transition:all .2s}
.music-item:not(.no-video):hover .music-play{border-color:var(--accent);color:var(--accent)}
.music-info{min-width:0}
.music-title{font-family:var(--font-d);font-size:19px;font-weight:400;font-style:italic;color:var(--text);margin-bottom:2px}
.music-by{font-family:var(--font-m);font-size:10px;color:var(--text-muted);margin-bottom:6px}
.music-bottom{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.music-cat-tag{font-family:var(--font-m);font-size:8px;color:var(--text-dim);letter-spacing:.1em}
.music-links{display:flex;gap:6px;flex-wrap:wrap}
.music-link-btn{font-family:var(--font-m);font-size:8px;letter-spacing:.08em;color:var(--accent);border:1px solid var(--accent-dim);padding:3px 8px;text-decoration:none;transition:all .2s;white-space:nowrap}
.music-link-btn:hover{background:var(--accent);color:var(--bg)}
.music-year{font-family:var(--font-m);font-size:10px;color:var(--text-dim);text-align:right;white-space:nowrap;flex-shrink:0;align-self:start;padding-top:4px}
.music-player{max-width:860px;background:var(--surface);border:1px solid var(--border);border-top:none;display:none}
.music-player.open{display:block}
.music-player-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;border-bottom:1px solid var(--border)}
.music-player-label{font-family:var(--font-m);font-size:9px;color:var(--text-muted);letter-spacing:.08em}
.music-player-close{font-family:var(--font-m);font-size:9px;color:var(--text-dim);background:none;border:none;cursor:pointer;transition:color .2s;letter-spacing:.1em}
.music-player-close:hover{color:var(--accent)}
.music-player-frame{position:relative;width:100%;aspect-ratio:16/9}
.music-player-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:none}

/* ─── SERGİLER ─── */
.exh-list{display:flex;flex-direction:column;gap:40px;max-width:780px}
.exh-item{display:grid;grid-template-columns:90px 1fr;gap:32px;padding-bottom:40px;border-bottom:1px solid var(--border)}
.exh-item:last-child{border-bottom:none;padding-bottom:0}
.exh-year{font-family:var(--font-m);font-size:11px;color:var(--accent);padding-top:6px}
.exh-title{font-family:var(--font-d);font-size:22px;font-weight:400;font-style:italic;color:var(--text);margin-bottom:6px;line-height:1.3}
.exh-venue{font-family:var(--font-m);font-size:10px;color:var(--text-dim);margin-bottom:10px}
.exh-roles{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.exh-role{font-family:var(--font-m);font-size:9px;letter-spacing:.12em;color:var(--accent);border:1px solid var(--accent-dim);padding:3px 9px;text-transform:uppercase}
.exh-desc{font-family:var(--font-m);font-size:11px;color:var(--text-dim);line-height:1.7}
.blog-soon{font-family:var(--font-d);font-size:22px;color:var(--text-muted);font-style:italic;padding:60px 0}

/* ─── İLETİŞİM: profesyonel tasarım ─── */
.contact-intro{font-family:var(--font-d);font-size:30px;font-weight:300;color:var(--text);line-height:1.4;margin-bottom:56px;max-width:620px}
.contact-intro em{font-style:italic;color:var(--accent)}
.contact-email-block{display:flex;align-items:center;justify-content:space-between;max-width:900px;border:1px solid var(--border);padding:28px 40px;margin-bottom:1px;text-decoration:none;background:var(--bg);transition:background .2s;cursor:pointer}
.contact-email-block:hover{background:var(--surface)}
.contact-email-block:hover .contact-email-arrow{color:var(--accent)}
.contact-email-label{font-family:var(--font-m);font-size:9px;color:var(--text-dim);letter-spacing:.18em;text-transform:uppercase;margin-bottom:8px}
.contact-email-addr{font-family:var(--font-d);font-size:clamp(20px,2.5vw,30px);font-weight:400;color:var(--text);letter-spacing:.01em}
.contact-email-arrow{font-family:var(--font-m);font-size:22px;color:var(--text-dim);transition:color .2s;flex-shrink:0;margin-left:24px}
.contact-lower{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border:1px solid var(--border);max-width:900px}
.contact-group{background:var(--bg);padding:32px 40px}
.contact-group-label{font-family:var(--font-m);font-size:9px;color:var(--text-dim);letter-spacing:.18em;margin-bottom:24px;padding-bottom:14px;border-bottom:1px solid var(--border);text-transform:uppercase}
.contact-link{display:flex;align-items:baseline;justify-content:space-between;font-family:var(--font-d);font-size:20px;font-weight:400;color:var(--text-muted);text-decoration:none;padding:10px 0;transition:color .2s;border-bottom:1px solid var(--border)}
.contact-link:last-child{border-bottom:none}
.contact-link:hover{color:var(--accent)}
.contact-link-sub{font-family:var(--font-m);font-size:9px;color:var(--text-dim);letter-spacing:.08em;transition:color .2s}
.contact-link:hover .contact-link-sub{color:var(--accent-dim)}

/* ─── MOBİL: hamburger + sol sidebar ─── */
@media(max-width:860px){
  nav{
    position:fixed;top:0;left:-240px;width:220px;height:100vh;
    flex-direction:column;align-items:flex-start;
    padding:48px 32px;border-right:1px solid var(--border);border-bottom:none;
    gap:0;transition:left .3s ease;z-index:200;right:auto;
  }
  nav.open{left:0}
  .nav-logo{margin-bottom:8px}
  .nav-links{margin-left:0;margin-top:36px;flex-direction:column;gap:2px}
  .nav-links a{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:11px}
  .nav-links a::before{content:'';width:16px;height:1px;background:var(--text-dim);transition:width .2s,background .2s;flex-shrink:0}
  .nav-links a.active::before,.nav-links a:hover::before{width:28px;background:var(--accent)}
  .lang-sw{margin-top:28px}
  .nav-bottom{display:block;margin-top:auto;font-size:10px;color:var(--text-dim);letter-spacing:.08em}
  .nav-bottom a{color:var(--text-dim);text-decoration:none;transition:color .2s}
  .nav-bottom a:hover{color:var(--accent)}
  .nav-hamburger{
    display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;
    position:fixed;top:16px;right:16px;z-index:300;
    width:40px;height:40px;background:var(--bg);border:1px solid var(--border);cursor:pointer;
  }
  .nav-hamburger span{display:block;width:18px;height:1px;background:var(--text)}
  main{padding-top:0}
  .page{padding:48px 20px 48px}
  #home.active{justify-content:flex-start;padding-top:72px;padding-bottom:48px;min-height:100vh}
  .home-name{font-size:clamp(44px,12vw,72px)}
  .home-tagline{gap:14px;flex-direction:column}

  /* Hakkımda: tek sütun */
  .about-layout{grid-template-columns:1fr;gap:36px}
  .about-photo{aspect-ratio:4/3}
  .about-text{font-size:17px}

  /* İşler */
  .works-grid{grid-template-columns:1fr}

  /* Müzik */
  .music-item{grid-template-columns:32px 1fr;gap:12px;padding:16px 16px}
  .music-year{display:none}
  .music-filter{padding:10px 14px}
  .music-title{font-size:17px}

  /* Sergiler */
  .exh-item{grid-template-columns:1fr;gap:8px}

  /* İletişim */
  .contact-intro{font-size:22px;margin-bottom:36px}
  .contact-email-block{padding:20px 24px;flex-direction:column;align-items:flex-start;gap:12px}
  .contact-email-arrow{display:none}
  .contact-email-addr{font-size:18px}
  .contact-lower{grid-template-columns:1fr}
  .contact-group{padding:24px 24px}
}
</style>
</head>
<body>

<button class="nav-hamburger" id="navToggle" aria-label="Menü">
  <span></span><span></span><span></span>
</button>
<div class="nav-overlay" id="navOverlay"></div>

<nav id="mainNav">
  <div class="nav-logo" onclick="showPage('home')">
    <img class="nav-logo-img" src="logo.png" alt="Aybike Özsöyke Sound Production">
  </div>
  <ul class="nav-links"></ul>
  <div class="lang-sw">
    <button class="lang-btn active" data-lang="tr" onclick="setLang('tr')">TR</button>
    <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
    <button class="lang-btn" data-lang="de" onclick="setLang('de')">DE</button>
  </div>
  <div class="nav-bottom"><a href="https://www.aybikeozsoyke.com">aybikeozsoyke.com</a></div>
</nav>

<main>
  <section class="page" id="home">
    <div class="home-eyebrow"></div>
    <h1 class="home-name">Aybike<br><em>Özsöyke</em></h1>
    <div class="home-tagline"></div>
    <svg class="home-waveform" viewBox="0 0 1200 120" preserveAspectRatio="none" fill="none" xmlns="http://www.w3.org/2000/svg"><polyline stroke="#c4956a" stroke-width="1" points="0,60 25,20 30,100 35,40 40,80 45,55 55,10 60,110 65,30 70,90 80,70 85,45 90,75 95,60 115,25 120,95 125,35 130,85 145,15 150,105 155,40 160,80 175,45 180,75 215,30 220,90 225,45 230,75 245,20 250,100 255,40 260,80 275,45 280,75 325,35 330,85 335,50 340,70 350,75 355,55 365,15 370,105 375,40 380,80 395,45 400,75 445,25 450,95 455,35 460,85 475,20 480,100 485,40 490,80 535,30 540,90 545,45 550,75 565,20 570,100 575,40 580,80 625,35 630,85 645,15 650,105 655,40 660,80 725,25 730,95 735,35 740,85 755,20 760,100 765,40 770,80 825,35 830,85 835,50 840,70 1000,60 1200,60"/></svg>
  </section>

  <section class="page" id="about">
    <div class="section-label" id="lbl-about"></div>
    <div class="about-layout">
      <p class="about-text"></p>
      <div class="about-right">
        <img class="about-photo" src="photo.jpg" alt="Aybike Özsöyke">
        <div class="about-meta">
          <div class="meta-item"><div class="meta-label"></div><div class="meta-value"></div></div>
          <div class="meta-item"><div class="meta-label"></div><div class="meta-value"></div></div>
        </div>
      </div>
    </div>
  </section>

  <section class="page" id="works">
    <div class="section-label" id="lbl-works"></div>
    <div class="works-grid"></div>
  </section>

  <section class="page" id="music">
    <div class="section-label" id="lbl-music"></div>
    <div class="music-filters"></div>
    <div class="music-list"></div>
    <div class="music-player" id="musicPlayer">
      <div class="music-player-bar">
        <span class="music-player-label" id="musicPlayerLabel"></span>
        <button class="music-player-close" onclick="closePlayer()">✕ kapat</button>
      </div>
      <div class="music-player-frame">
        <iframe id="musicIframe" src="" allowfullscreen
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">
        </iframe>
      </div>
    </div>
  </section>

  <section class="page" id="exhibitions">
    <div class="section-label" id="lbl-exhibitions"></div>
    <div class="exh-list"></div>
  </section>

  <section class="page" id="blog">
    <div class="section-label" id="lbl-blog"></div>
    <p class="blog-soon"></p>
  </section>

  <section class="page" id="contact">
    <div class="section-label" id="lbl-contact"></div>
    <p class="contact-intro"></p>
    <div id="contactEmail"></div>
    <div class="contact-lower" id="contactLower"></div>
  </section>
</main>

let lang = 'tr', page = 'home', musicFilter = 'all';
const t = () => SITE[lang];
const pages = ['home','about','works','music','exhibitions','blog','contact'];

function upper(str, l) {
  if (l === 'tr') return str.toLocaleUpperCase('tr-TR');
  return str.toUpperCase();
}

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  const el = document.querySelector(`[data-page="${id}"]`);
  if (el) el.classList.add('active');
  page = id;
  closeNav();
}

function setLang(l) {
  lang = l;
  document.documentElement.lang = l;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === l));
  render(); showPage(page);
}

function openNav() {
  document.getElementById('mainNav').classList.add('open');
  document.getElementById('navOverlay').classList.add('open');
}
function closeNav() {
  document.getElementById('mainNav').classList.remove('open');
  document.getElementById('navOverlay').classList.remove('open');
}

// ── YouTube embed dönüştürücü ──────────────────────────────────────────
function toEmbed(url) {
  if (!url) return null;
  let m = url.match(/youtu\.be\/([^?&]+)/);
  if (m) return `https://www.youtube.com/embed/${m[1]}?autoplay=1`;
  m = url.match(/[?&]v=([^&]+)/);
  if (m) return `https://www.youtube.com/embed/${m[1]}?autoplay=1`;
  m = url.match(/list=([^&]+)/);
  if (m) return `https://www.youtube.com/embed/videoseries?list=${m[1]}&autoplay=1`;
  return null;
}

function toSpotifyEmbed(url) {
  if (!url) return null;
  const m = url.match(/open\.spotify\.com\/(track|album|playlist)\/([A-Za-z0-9]+)/);
  if (m) return `https://open.spotify.com/embed/${m[1]}/${m[2]}`;
  return null;
}

function playItem(title, ytUrl, spotifyUrl) {
  const ytEmbed = toEmbed(ytUrl);
  const spEmbed = toSpotifyEmbed(spotifyUrl);
  const embed = ytEmbed || spEmbed;
  const isSpotify = !ytEmbed && !!spEmbed;
  if (!embed) return;
  const player = document.getElementById('musicPlayer');
  const frame = document.querySelector('.music-player-frame');
  const iframe = document.getElementById('musicIframe');
  iframe.src = embed;
  iframe.allow = isSpotify
    ? 'autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture'
    : 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
  frame.style.aspectRatio = isSpotify ? 'unset' : '16/9';
  frame.style.height = isSpotify ? '152px' : '';
  document.getElementById('musicPlayerLabel').textContent = title + ' — ' + t().music.playLabel;
  player.classList.add('open');
  player.scrollIntoView({ behavior:'smooth', block:'nearest' });
}
function closePlayer() {
  document.getElementById('musicIframe').src = '';
  document.getElementById('musicPlayer').classList.remove('open');
}

function setMusicFilter(cat) {
  musicFilter = cat;
  closePlayer();
  document.querySelectorAll('.music-filter').forEach(b =>
    b.classList.toggle('active', b.dataset.cat === cat));
  renderMusicList();
}

function renderMusicList() {
  const d = t();
  const items = musicFilter === 'all' ? MUSIC_ITEMS : MUSIC_ITEMS.filter(i => i.cat === musicFilter);
  document.querySelector('.music-list').innerHTML = items.map(item => {
    const hasVideo = !!toEmbed(item.yt) || !!toSpotifyEmbed(item.spotify);
    const esc = s => s.replace(/'/g, "\\'");
    return `
    <div class="music-item${hasVideo ? '' : ' no-video'}"
      ${hasVideo ? `onclick="playItem('${esc(item.title)}','${esc(item.yt||'')}','${esc(item.spotify||'')}')"` : ''}>
      <div class="music-play">${hasVideo ? '▶' : '·'}</div>
      <div class="music-info">
        <div class="music-title">${item.title}</div>
        <div class="music-by">${item.by}</div>
        <div class="music-bottom">
          <span class="music-cat-tag">${d.music.catLabels[item.cat] || ''}</span>
          <div class="music-links">
            ${item.yt ? `<a class="music-link-btn" href="${item.yt}" target="_blank" onclick="event.stopPropagation()">YouTube ↗</a>` : ''}
            ${item.spotify ? `<a class="music-link-btn" href="${item.spotify}" target="_blank" onclick="event.stopPropagation()">Spotify ↗</a>` : ''}
            ${item.apple ? `<a class="music-link-btn" href="${item.apple}" target="_blank" onclick="event.stopPropagation()">Apple Music ↗</a>` : ''}
          </div>
        </div>
      </div>
      <div class="music-year">${item.year}</div>
    </div>`;
  }).join('');
}

// ── Render ─────────────────────────────────────────────────────────────

  const d = t();
  // Nav
  document.querySelector('.nav-links').innerHTML = pages.map((p,i) =>
    `<li><a onclick="showPage('${p}')" data-page="${p}">${d.nav[i]}</a></li>`).join('');
  ['about','works','music','exhibitions','blog','contact'].forEach((id,i) => {
    const el = document.getElementById(`lbl-${id}`);
    if (el) el.textContent = upper(d.nav[i+1], lang);
  });
  // Ana sayfa
  document.querySelector('.home-eyebrow').textContent = d.home.location;
  document.querySelector('.home-tagline').innerHTML = d.home.roles.map(r=>`<span>${r}</span>`).join('');
  // Hakkımda
  document.querySelector('.about-text').innerHTML = d.about.text;
  document.querySelectorAll('.meta-item').forEach((el,i) => {
    el.querySelector('.meta-label').textContent = upper(d.about.metaLabels[i], lang);
    el.querySelector('.meta-value').innerHTML = d.about.meta[i].replace(/\n/g,'<br>');
  });
  // İşler
  document.querySelector('.works-grid').innerHTML = d.works.map(w=>`
    <div class="work-item">
      <div class="work-type">${w.type}</div>
      <div class="work-title">${w.title}</div>
      <div class="work-role">${w.role}</div>
      <div class="work-desc">${w.desc}</div>
      ${w.badge?`<div class="work-badge">${w.badge}</div>`:''}
    </div>`).join('');
  // Müzik
  document.querySelector('.music-filters').innerHTML = d.music.filters.map(f =>
    `<button class="music-filter${f.cat===musicFilter?' active':''}" data-cat="${f.cat}" onclick="setMusicFilter('${f.cat}')">${f.label}</button>`
  ).join('');
  renderMusicList();
  // Sergiler
  document.querySelector('.exh-list').innerHTML = d.exhibitions.map(e=>`
    <div class="exh-item">
      <div class="exh-year">${e.year}</div>
      <div>
        <div class="exh-title">${e.title}</div>
        <div class="exh-venue">${e.venue}</div>
        <div class="exh-roles">${e.roles.map(r=>`<span class="exh-role">${upper(r,lang)}</span>`).join('')}</div>
        <div class="exh-desc">${e.desc}</div>
      </div>
    </div>`).join('');
  // Blog
  document.querySelector('.blog-soon').textContent = d.blog;
  // İletişim
  document.querySelector('.contact-intro').innerHTML = d.contact.intro;
  const em = d.contact.email;
  document.getElementById('contactEmail').innerHTML = `
    <a class="contact-email-block" href="${em.href}">
      <div>
        <div class="contact-email-label">${upper(em.label, lang)}</div>
        <div class="contact-email-addr">${em.addr}</div>
      </div>
      <span class="contact-email-arrow">→</span>
    </a>`;
  document.getElementById('contactLower').innerHTML = d.contact.groups.map(g=>`
    <div class="contact-group">
      <div class="contact-group-label">${upper(g.label,lang)}</div>
      ${g.links.map(l=>`
        <a class="contact-link" href="${l.href}" target="_blank">
          <span>${l.text}</span>
          <span class="contact-link-sub">${l.sub}</span>
        </a>`).join('')}
    </div>`).join('');
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('navToggle').addEventListener('click', openNav);
  document.getElementById('navOverlay').addEventListener('click', closeNav);
